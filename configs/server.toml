# koukoukongjian 服务器配置
#
# 所有键都可省略：省略即用 internal/config 里的内置默认值。
# 注意加载器会拒绝未知键——拼错的键会静默保留默认值，那类问题极难查，
# 所以宁可启动时报错。
#
# 数值来源：docs/combat-design-v0.1.md §7 参数汇总表。改这里之前先改文档。

[server]
name       = "koukoukongjian"
bind       = "0.0.0.0:7777"
tick_rate  = 20   # 逻辑 tick 频率（Hz）。20Hz = 50ms 一个 tick
sub_steps  = 3    # 每 tick 的物理子步数。3 子步 × 20Hz = 60Hz 物理

[network]
interp_delay_ms     = 100  # 客户端插值缓冲。必须 ≥ 2 个 tick，否则丢一个包就断流
position_history_ms = 500  # 玩家位置环形缓冲时长，受击宽容回溯用

[combat]
hit_lag_compensation = true   # 受击宽容开关
hit_leniency_radius  = 0.15   # 米。回溯之后的额外宽容半径
max_bullets          = 512    # 子弹硬上限，超出淘汰最老的敌方子弹

[ai]
aggro_rescore_interval_s = 0.5  # 仇恨重算间隔
path_recalc_interval_s   = 0.3  # 寻路重算间隔

[space]
# 注意这是两套独立的格子，不要试图统一
spatial_cell_size       = 2.0  # 米。空间索引格，存实体下标，每 tick 重建
spatial_brute_threshold = 200  # 实体数低于此值改用暴力遍历（实测更快）
terrain_cell_size       = 1.0  # 米。地形位图格，存地/墙，一局只建一次

[world]
terrain_width  = 128   # 地形格数，×1m = 128 米宽
terrain_height = 128
max_players    = 4

# M3 世界与波次（灰盒起点值，server-design §5.3/§5.4/§7）
[map]
hub_count         = 7   # 据点数，6~8；0 是"关地图"哨兵（测试用空白世界）
hub_radius_cells  = 5   # 据点空地半径（格，1 格 = 1 m）
corridor_width    = 2   # 走廊宽（格），窄路制造瓶颈
hub_min_dist_cells = 20 # 据点中心最小间距（格），防撒点重叠

[fog]
reveal_radius = 8.0  # 玩家可视半径（米），点亮后永久保留

[waves]
waves_per_hub      = 3    # 每据点波数（spec 单关 5~8 波，灰盒先 3）
monsters_per_wave  = 4    # 每波怪数
inter_wave_delay_s = 1.0  # 清波到下一波的间隔（秒）

[monster]
speed             = 2.5   # 巡逻/追击基础速度（米/秒）
hp                = 50    # spec 拍板：怪物 50 血 10 攻
attack_range      = 1.2   # 进入该距离切换 attack（米）
attack_damage     = 10
attack_cooldown_s = 1.0
fast_chase_dist   = 15.0  # 与目标超过该距离开始加速（米），反风筝
fast_chase_mul    = 1.5   # 加速倍率，必须 ≥1
sight_range       = 20.0  # 感知半径（米），且要求视线可通（隔墙不吸怪）

# M4 成长（灰盒起点值，spec L105：第一关第一个据点就能升一级，之后频率递减）
[progression]
exp_base              = 20    # 1 级升 2 级所需经验。曲线是几何级数，这是首项
exp_growth            = 1.35  # 每级乘数，必须 ≥1。>1 让升级自然递减，不需要分段表
max_level             = 20    # 等级上限，必须 1..99（Level 字段是 uint8）
skill_choice_window_s = 5     # 三选一决策窗口（秒）。0 等于不给人选，被 Validate 拒
kill_exp              = 8     # 击杀一只怪的基础经验。20 配 8：一个据点 12 只怪 = 96 点

[log]
level  = "info"  # debug / info / warn / error
format = "text"  # text / json

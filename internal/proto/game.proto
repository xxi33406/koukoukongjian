// 游戏协议消息定义。
//
// 这份 .proto 是 Go 服务端与 Unity C# 客户端的唯一协议真相：
// 两边都由它生成代码，字段顺序错位这类只在运行时暴露的 bug 才不会发生。
// 术语与 docs/server-design-v0.1.md §13、docs/combat-design-v0.1.md §6 对齐。
syntax = "proto3";

package proto;

option go_package = "koukoukongjian/internal/proto;proto";

// C# 的命名空间。不加这一行，protoc 会把 package 名首字母大写得到
// namespace Proto —— 这是个通用词，Unity 项目里极容易与别的插件撞名，
// 撞了的症状是一堆"找不到类型"或"类型有歧义"，而错误指向的却是生成文件。
option csharp_namespace = "KK.Proto";

// ---------- 连接与房间 ----------

// Hello 是客户端连接后的第一条消息（可靠通道）。
message Hello {
  uint32 protocol_version = 1; // 与 netx.Version 对应，不匹配直接拒绝
  string player_name = 2;      // 仅用于显示，不参与逻辑
  string token = 3;            // 重连凭证，首次连接为空
}

message HelloAck {
  uint64 session_id = 1;
  string token = 2;    // 后续重连带上它即可恢复原槽位
  string room_id = 3;  // 服务器分配的房间
  uint32 tick_rate = 4;
}

// JoinRoom 请求加入房间。
message JoinRoom {
  string room_id = 1;
  uint32 preferred_slot = 2; // 0xFF 表示不指定
}

message JoinOk {
  uint32 slot = 1;      // 0..3
  int64 world_seed = 2;
  uint32 start_tick = 3;
}

// PlayerJoined / PlayerLeft 上报槽位变化。
message PlayerJoined {
  uint32 slot = 1;
  string name = 2;
}

message PlayerLeft {
  uint32 slot = 1;
  uint32 reason = 2; // 0=quit 1=timeout 2=kicked
}

// ---------- 输入与快照 ----------

// Input 是上行输入包，**走快照通道**（不可靠，丢了就丢）。
//
// 为什么走快照通道而不是可靠通道：输入是"覆盖式"数据，第 N+1 帧的意图
// 本来就该覆盖第 N 帧。走可靠通道的话，丢一帧会让后面所有帧排队等它
// 重传（实测 10% 丢包下 60 帧里有 36 帧被连带延迟，最大 116ms），
// 而那帧的意图早就被覆盖了——迟到不如不到。
// 实测数据与完整对比见 docs/channel-design.md。
//
// 抗丢包靠客户端重复携带：每一包包含**最近 N 个输入快照**（N=3 建议值），
// 而不是只含当前一帧。服务器按 frame.tick 去重，取最新一帧作为移动意图，
// 并把窗口内出现过的所有 buttons 位做**按位或**，用于捕获短按。
//
// 这样做的代价：10% 独立丢包下，连续丢 3 包的概率是 0.1%——也就是说
// 短按被彻底丢失的概率是千分之一，而不是 10%。
// 带宽代价：带 3 帧时上行 6.5 KB/s（带 1 帧是 2.7 KB/s），
// 只占快照下行带宽（60~120 KB/s）的 5~10%。实测见 docs/channel-design.md。
message Input {
  // client_tick 是客户端**采样最新一帧时**的世界 tick。
  // 服务器用它做基准时钟对齐，并用于计算丢掉了多少帧。
  uint32 client_tick = 1;

  // frames 是最近 N 个输入快照，**按 tick 升序排列**，最后一帧最新。
  //
  // 服务器不要求长度固定：收到几帧就处理几帧。
  // 长度为 1 是合法的（客户端刚启动或极端带宽受限），
  // 但强烈建议客户端始终带满 3 帧以获得抗丢包能力。
  repeated InputFrame frames = 2;
}

message InputFrame {
  // tick 是这一帧采样时的客户端世界 tick，**必须严格递增**。
  // 服务器用 (slot, tick) 做去重键：同一帧重复送达只应用一次。
  uint32 tick = 1;

  int32 move_x = 2;  // -1000..1000 量化的移动意图
  int32 move_y = 3;
  int32 aim_x = 4;   // 瞄准方向（单位向量 × 1000）
  int32 aim_y = 5;
  // buttons 是"当前按住"的位掩码：1=攻击 2=技能1 4=技能2 8=交互。
  //
  // 注意是"按住"而不是"本帧按下"。服务器会在整个 frames 窗口内做按位或，
  // 所以短按（按下又松开发生在两包之间）只要有一帧被送达就能被捕获。
  uint32 buttons = 6;
}

// Vec2Q 是量化后的二维向量。精度见 combat-design §6.2。
message Vec2Q {
  int32 x = 1;
  int32 y = 2;
}

message PlayerSelf {
  uint32 entity_id = 1;
  Vec2Q pos = 2;      // 1/32 m
  Vec2Q vel = 3;      // 1/256 m/s
  uint32 aim = 4;     // 2π/65536
  int32 hp = 5;
  int32 max_hp = 6;
  uint32 gold = 7;
  uint32 state = 8;    // PlayerStateKind
  uint32 flags = 9;

  // 以下三个字段是 M4 的成长信息。protobuf 没有 uint8/uint16，所以
  // 小整数一律用 uint32，范围约束写在这里而不是交给类型检查：
  //   level       1..99（MaxLevel），0 表示尚未初始化——出生时池只清零，
  //               Level=1 由 room.handleJoin 设置，进 join 之前的帧里是 0。
  //   exp         当前等级内已积累的经验，0..exp_to_next-1。
  //   exp_to_next 升到下一级所需的经验（分母，客户端画进度条用）。
  //               满级时由曲线给出 0，客户端见到 0 应当画满而不是除零。
  uint32 level = 10;
  uint32 exp = 11;
  uint32 exp_to_next = 12;

  // 两个技能槽的剩余冷却（M7）。1/100 秒，0 表示可用。
  // 量化到 1/100 而不是更细：客户端只用它画一个扇形遮罩，10ms 粒度远
  // 超人眼分辨力，而 uint32 省下的位宽换成每秒重发的一致性收益为零。
  repeated uint32 skill_cooldown_q = 13;
}

// SkillChoice 是一个候选技能。
message SkillChoice {
  uint32 skill_id = 1; // 见 internal/game/build/skills.go 的 SkillID* 常量，1..8
  uint32 kind = 2;     // 0=被动 1=主动（build.SkillKind，只有这两值）
}

// SkillChoices（S→C 可靠）是服务端发来的升级三选一。
// 服务端权威：候选由服务端生成，客户端只负责显示与选择。
// 客户端算不出候选，也不该算——候选池、稀有度、去重都在服务端。
message SkillChoices {
  uint32 level = 1;                 // 升到了几级，1..99
  repeated SkillChoice choices = 2; // 2~3 个候选（池耗尽时可能更少）
  // window_ticks 是决策窗口长度，单位 tick（20Hz 下 30 tick ≈ 1.5 秒）。
  // 用 tick 不用秒：超时判定发生在 tick 循环里，「再过 N 个 tick」是精确
  // 可复现的；用秒就要做时间→tick 的换算，同样 N 秒在不同 tick_rate
  // 下窗口长度不同，回放测试也会因浮点而抖动。
  uint32 window_ticks = 3;
}

// ChooseSkill（C→S 可靠）是玩家的选择。
message ChooseSkill {
  uint32 choice_index = 1; // 对应 SkillChoices.choices 的下标，越界由服务端拒绝
}

// Interact（C→S 可靠）是交互请求（M4 只用于拾取与开背包）。
message Interact {
  uint32 kind = 1; // 1=拾取最近 2=开背包，其余值服务端忽略
}

// Inventory（S→C 可靠）是玩家的背包状态。
//
// 为什么是独立消息而不是快照字段：背包只在开背包时看，且变化极低频
// （升级选技能、拾取道具）。塞进每秒 20 次的 Snapshot.Self 会让每个
// 玩家每帧多背最多 7 个变长数组，而其中 99% 的帧内容完全一样。
message Inventory {
  repeated uint32 active_skills = 1;  // 主动技能槽（上限 2），元素是 SkillID*
  repeated uint32 passive_skills = 2; // 被动技能槽（上限 2），元素是 SkillID*
  repeated uint32 items = 3;          // 道具槽（上限 3），元素是道具种类编号
}

// ShopItem 是货架上的一项。
message ShopItem {
  uint32 index = 1;    // 货架下标（0-3），买的时候发这个
  uint32 kind = 2;     // 0=被动技能 1=道具
  uint32 ref_id = 3;   // 技能 ID 或道具 ID
  uint32 price = 4;    // 价格（金币）
  bool sold = 5;       // 已售出
}

// ShopRack 是发给某个玩家的私人货架（S→C 可靠）。
//
// 私人：每个玩家的货架内容不同，所以这条消息必须单播而不是广播。
// spec L83「私人货架：每个玩家的商品列表不一样」。
message ShopRack {
  uint32 hub = 1;             // 商店所属据点下标
  repeated ShopItem items = 2;
  uint32 gold = 3;            // 玩家当前金币（客户端用来置灰买不起的项）
}

// ShopBuy 是客户端发起买入（C→S 可靠）。
message ShopBuy {
  uint32 hub = 1;           // 期望的据点（防玩家在 A 据点点开商店、走到 B 据点才发买入）
  uint32 item_index = 2;    // 货架下标
  uint32 target_slot = 3;   // 收货人座位号；等于自己就是给自己买（spec L84-85 替队友买）
}

message Snapshot {
  uint32 server_tick = 1;
  uint32 acked_input_tick = 2; // 供客户端校正本地预测
  PlayerSelf self = 3;         // 只含接收者自己的状态
  repeated EntityDelta adds = 4;    // 本 tick 新出现的实体
  repeated EntityDelta updates = 5; // 本 tick 变化的实体
  repeated uint32 removes = 6;      // 本 tick 消失的实体 ID
  repeated uint64 fog_delta = 7;    // 新点亮的迷雾格
  repeated GameEvent events = 8;    // 搭车的小事件
  // removes_kind 与 removes 平行同序：第 i 个元素描述第 i 个 removes 的
  // 实体种类。两个切片长度必须永远相等。
  //
  // 为什么需要它：removes 只有裸 ID，而四个实体池各自从索引 1 开始编号，
  // 同一个 uint32 可以同时是"玩家 1"和"怪物 1"。客户端按裸 ID 删条目时，
  // 撞号就会删掉同号但不同池的那个实体——表现为场上少一只怪、多一条幽灵。
  repeated EntityKind removes_kind = 9;
  // full 表示这一帧是全量快照：客户端应清空自己的实体表，然后完全按
  // adds 重建。
  //
  // 为什么需要显式标志：快照走不可靠 UDP，丢一个 remove 包那条实体就
  // 永久留在客户端表里了。全量帧是唯一的自愈机会，但客户端无法从字段
  // 形状上分辨"全量"与"刚好没有变化的增量帧"——两者可以完全同形。
  bool full = 10;
  // full 帧（full=true）时带完整迷雾位图，每 bit 一格（M7）。
  //
  // 只在 full 帧带：增量帧用 fog_delta 就够，每帧重发 2KB 是浪费
  //（20Hz 下就是 40KB/s）。没有它，客户端重连后整张图回到全黑，
  // 已探明的区域要重新走一遍。
  repeated uint64 fog_full = 11;
}

// EntityDelta 是实体状态。全量时所有字段都填，增量时只填变化的。
message EntityDelta {
  uint32 entity_id = 1;
  EntityKind kind = 2;
  Vec2Q pos = 3;
  Vec2Q vel = 4;
  uint32 aim = 5;
  int32 hp = 6;
  int32 max_hp = 7;
  uint32 state = 8;
  uint32 flags = 9;
  uint32 element = 10;
  uint32 owner_id = 11; // 子弹/技能的主人
  uint32 radius_q = 12; // 1/256 m
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_BULLET = 3;
  ENTITY_KIND_PICKUP = 4;
}

enum GameEventKind {
  GAME_EVENT_KIND_UNSPECIFIED = 0;
  GAME_EVENT_KIND_DAMAGE = 1;
  GAME_EVENT_KIND_KILL = 2;
  GAME_EVENT_KIND_PICKUP = 3;
  GAME_EVENT_KIND_LEVEL_UP = 4;
  GAME_EVENT_KIND_DEATH = 5;
  GAME_EVENT_KIND_REVIVE = 6;
  // GAME_EVENT_KIND_WIPE 是团灭：全队变成鬼魂（spec L52 "本局失败"）。
  //
  // M5 只广播事件不停房间（用户拍板决定 4）：灰盒没有关卡脚本，停下房间
  // 就只剩重启能看。a/b 两个字段都留空，客户端按"收到即显示失败 UI"处理，
  // 不要从 a/b 里猜谁死了——谁死了由各自的 PlayerSelf.state 表达。
  GAME_EVENT_KIND_WIPE = 7;
}

message GameEvent {
  GameEventKind kind = 1;
  uint32 a = 2; // 语义随 kind：source / entity / slot
  uint32 b = 3; // target / amount
  int32 value = 4;
  uint32 element = 5;
}

// ---------- 结算（M7） ----------

// MatchOutcome 是本局终态。三值而不是 bool：房间可能既没团灭也没通关
//（进程被 kill、玩家全部离开），那必须能表达成 UNSPECIFIED。
enum MatchOutcome {
  MATCH_OUTCOME_UNSPECIFIED = 0;
  MATCH_OUTCOME_WIPED = 1;    // 团灭：全队变鬼魂（spec L52）
  MATCH_OUTCOME_CLEARED = 2;  // 通关：全部据点清完且 Boss 被击败
}

// MatchPlayer 是一名玩家在一局里的战绩。
// 字段名与 server-design §11.1 的 player_result 表一致——前端不必自己
// 发明名字，也便于日后对着数据库列核对。
message MatchPlayer {
  uint32 slot = 1;
  double damage = 2;
  double contribute = 3;
  uint32 kills = 4;
  uint32 reflect_kills = 5;
  uint32 deaths = 6;
  uint32 gold = 7;
}

// MatchResult 是一局的结果。
message MatchResult {
  string room_id = 1;
  int64 world_seed = 2;
  int64 started_at = 3;   // Unix 秒
  int64 ended_at = 4;
  MatchOutcome outcome = 5;
  uint32 max_wave = 6;
  int64 duration_sec = 7;
  repeated MatchPlayer players = 8;
}

// ---------- 其他上行 ----------

// Ping 每 500ms 一次，用于 RTT 采样。
message Ping {
  uint64 client_time_ns = 1;
}

message Pong {
  uint64 client_time_ns = 1;
  uint64 server_time_ns = 2;
}

// ReqFullSnapshot 让客户端在发现丢包时主动请求全量基线。
message ReqFullSnapshot {
  uint32 last_seen_tick = 1;
}

// ---------- 信封 ----------

// Envelope 是**两条通道**上所有消息的统一外壳。
//
// 可靠通道是字节流语义，必须自带消息边界，所以每条消息都过 Envelope。
// 快照通道虽然一条消息就是一个包、理论上不需要边界，但也必须套：
// protobuf 的裸消息没有类型标签，Unmarshal 遇到认不出的字段会静默跳过
// 而不是报错。同一条通道上只要出现第二种消息，裸格式就会互相误判——
// 实测裸 Snapshot 当 Envelope 解得到 err=nil/body=nil，Envelope{Pong}
// 当 Snapshot 解得到 err=nil/tick=0，两次误判都不报错，客户端表现为
// "连上了但画面不动"。套一层靠 oneof 的字段号区分类型。
// 详见 docs/milestone-m1-cleanup.md §6.1。
message Envelope {
  oneof body {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    JoinRoom join_room = 3;
    JoinOk join_ok = 4;
    PlayerJoined player_joined = 5;
    PlayerLeft player_left = 6;
    Input input = 7;
    Snapshot snapshot = 8;
    Ping ping = 9;
    Pong pong = 10;
    ReqFullSnapshot req_full_snapshot = 11;

    // M4 成长与交互。1-11 已上线，字段号只能往后续，不能插空或重排。
    // 12~13 是升级三选一的一发一收，14 是交互请求，15 是背包状态。
    SkillChoices skill_choices = 12;
    ChooseSkill choose_skill = 13;
    Interact interact = 14;
    Inventory inventory = 15;

    // M6 商店。16 是私人货架下发，17 是买入请求。
    ShopRack shop_rack = 16;
    ShopBuy shop_buy = 17;

    // M7 结算。18 是终局结果（S→C）。
    MatchResult match_result = 18;
  }
}
